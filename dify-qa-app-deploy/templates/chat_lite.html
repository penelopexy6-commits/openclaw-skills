<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><APP_NAME></title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }
header { background:#2b6cb0; color:#fff; padding:14px 16px; font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; }
header span { font-size:20px; }
#msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:80%; padding:10px 13px; border-radius:12px; line-height:1.6; font-size:15px; white-space:pre-wrap; word-break:break-word; }
.user { align-self:flex-end; background:#2b6cb0; color:#fff; border-bottom-right-radius:4px; }
.bot { align-self:flex-start; background:#fff; color:#333; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
.bot.error { background:#fff5f5; color:#c53030; }
#inputbar { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #e2e8f0; }
#q { flex:1; padding:11px 14px; border:1px solid #cbd5e0; border-radius:10px; font-size:15px; outline:none; }
#q:focus { border-color:#2b6cb0; }
#send { padding:11px 22px; background:#2b6cb0; color:#fff; border:none; border-radius:10px; font-size:15px; cursor:pointer; }
#send:disabled { background:#a0aec0; }
.sugg { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 10px; }
.sugg button { background:#fff; border:1px solid #cbd5e0; border-radius:16px; padding:6px 14px; font-size:13px; color:#2b6cb0; cursor:pointer; }
.sugg button:hover { border-color:#2b6cb0; background:#ebf8ff; }
</style>
</head>
<body>
<header><span>📋</span> <APP_NAME></header>
<div id="msgs">
  <div class="msg bot"><WELCOME_MSG></div>
</div>
<div class="sugg" id="sugg">
  <!-- 可选：快捷问题按钮，按业务改 -->
  <button onclick="ask(this.textContent)">示例问题1？</button>
  <button onclick="ask(this.textContent)">示例问题2？</button>
</div>
<div id="inputbar">
  <input id="q" placeholder="输入你的问题…" autocomplete="off">
  <button id="send" onclick="ask()">发送</button>
</div>
<script>
const API = "/v1/chat-messages";
const KEY = "<API_KEY>";
const msgs = document.getElementById("msgs");
const inp = document.getElementById("q");
const btn = document.getElementById("send");
let busy = false;

inp.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

async function ask(question) {
  const q = (question || inp.value).trim();
  if (!q || busy) return;
  busy = true; btn.disabled = true;
  add(q, "user");
  inp.value = "";
  const w = add("思考中…", "bot");
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, inputs: {}, response_mode: "blocking", user: "web" })
    });
    const d = await r.json();
    w.textContent = d.answer || ("错误: " + (d.message || JSON.stringify(d)));
    if (d.answer) w.classList.remove("error");
  } catch (e) {
    w.textContent = "请求失败: " + e.message;
    w.classList.add("error");
  }
  busy = false; btn.disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
